<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конфигуратор игры "Цветной Рассказ"</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h1 class="mb-4">🌈 Конфигуратор игры "Цветной Рассказ"</h1>
        <div class="row g-4">
            <!-- Left column: Settings -->
            <div class="col-lg-5">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Настройки</h5>
                        <div class="mb-3">
                            <label for="textInput" class="form-label">Текст для отображения:</label>
                            <input type="text" id="textInput" class="form-control" value="Вечер был тихим. Солнце медленно садилось за горизонт.">
                        </div>
                        <div class="mb-3">
                            <label for="minSpeedInput" class="form-label">Минимальная скорость: <span id="minSpeedValue">1</span></label>
                            <input type="range" id="minSpeedInput" class="form-range" min="1" max="10" step="1" value="1">
                        </div>
                        <div class="mb-3">
                            <label for="maxSpeedInput" class="form-label">Максимальная скорость: <span id="maxSpeedValue">5</span></label>
                            <input type="range" id="maxSpeedInput" class="form-range" min="1" max="10" step="1" value="5">
                        </div>
                        <div class="mb-3">
                            <label for="sizeInput" class="form-label">Размер текста: <span id="sizeValue">2.5</span>rem</label>
                            <input type="range" id="sizeInput" class="form-range" min="1" max="5" step="0.1" value="2.5">
                        </div>
                        <div class="mb-3">
                            <label for="modeInput" class="form-label">Режим смены цвета:</label>
                            <select id="modeInput" class="form-select">
                                <option value="gradient" selected>Плавный (градиент)</option>
                                <option value="instant">Мгновенный</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="satInput" class="form-label">Насыщенность цвета: <span id="satValue">100</span>%</label>
                            <input type="range" id="satInput" class="form-range" min="0" max="100" step="1" value="100">
                        </div>
                        <div class="mb-3">
                            <label for="lightInput" class="form-label">Яркость цвета: <span id="lightValue">50</span>%</label>
                            <input type="range" id="lightInput" class="form-range" min="10" max="90" step="1" value="50">
                        </div>
                        <div class="mb-3">
                            <label for="bgColorInput" class="form-label">Цвет фона:</label>
                            <input type="color" id="bgColorInput" class="form-control form-control-color" value="#000000">
                        </div>
                        <div class="mb-3">
                            <label for="bgInput" class="form-label">URL фонового изображения (необязательно):</label>
                            <input type="url" id="bgInput" class="form-control" placeholder="https://example.com/background.jpg">
                        </div>
                        <hr>
                        <div class="mb-3">
                            <label for="urlDisplay" class="form-label">Сгенерированная ссылка:</label>
                            <div class="input-group">
                                <input type="text" id="urlDisplay" class="form-control" readonly>
                                <button class="btn btn-outline-secondary" type="button" id="copyLink">Копировать</button>
                            </div>
                        </div>
                        <a id="gameLink" href="#" target="_blank" class="btn btn-success w-100">🚀 Открыть игру в новой вкладке</a>
                    </div>
                </div>
            </div>
            <!-- Right column: Preview -->
            <div class="col-lg-7">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Превью</h5>
                        <div class="ratio ratio-1x1 border rounded">
                            <iframe id="previewFrame" src="" title="Превью игры"></iframe>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inputs = {
            text: document.getElementById('textInput'),
            minSpeed: document.getElementById('minSpeedInput'),
            maxSpeed: document.getElementById('maxSpeedInput'),
            size: document.getElementById('sizeInput'),
            mode: document.getElementById('modeInput'),
            sat: document.getElementById('satInput'),
            light: document.getElementById('lightInput'),
            bgcolor: document.getElementById('bgColorInput'),
            bg: document.getElementById('bgInput')
        };

        const values = {
            minSpeed: document.getElementById('minSpeedValue'),
            maxSpeed: document.getElementById('maxSpeedValue'),
            size: document.getElementById('sizeValue'),
            sat: document.getElementById('satValue'),
            light: document.getElementById('lightValue')
        };

        const urlDisplay = document.getElementById('urlDisplay');
        const gameLink = document.getElementById('gameLink');
        const copyLink = document.getElementById('copyLink');
        const previewFrame = document.getElementById('previewFrame');

        function updateLink() {
            const baseUrl = 'index.html';
            const params = new URLSearchParams();

            const minSpeed = parseInt(inputs.minSpeed.value, 10);
            const maxSpeed = parseInt(inputs.maxSpeed.value, 10);

            // Higher speed value = lower animation duration
            const minDuration = 11 - maxSpeed;
            const maxDuration = 11 - minSpeed;

            if (inputs.text.value !== "Вечер был тихим. Солнце медленно садилось за горизонт.") params.set('text', inputs.text.value);

            if (minSpeed !== 1 || maxSpeed !== 5) {
                params.set('min', minDuration);
                params.set('max', maxDuration);
            }

            if (inputs.size.value !== '2.5') params.set('size', inputs.size.value);
            if (inputs.mode.value !== 'gradient') params.set('mode', inputs.mode.value);
            if (inputs.sat.value !== '100') params.set('sat', inputs.sat.value);
            if (inputs.light.value !== '50') params.set('light', inputs.light.value);
            if (inputs.bgcolor.value !== '#000000') params.set('bgcolor', inputs.bgcolor.value.substring(1));
            if (inputs.bg.value) params.set('bg', inputs.bg.value);

            const queryString = params.toString();
            const previewUrl = queryString ? `${baseUrl}?${queryString}` : baseUrl;
            const fullUrl = `https://cosmogeniusee-droid.github.io/games/CharColorizer/${previewUrl}`;

            urlDisplay.value = fullUrl;
            gameLink.href = previewUrl;
            previewFrame.src = previewUrl;
        }

        function copyTextToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = copyLink.textContent;
                copyLink.textContent = 'Скопировано!';
                setTimeout(() => { copyLink.textContent = originalText; }, 2000);
            }).catch(err => console.error('Ошибка копирования: ', err));
        }

        // Event listeners
        Object.values(inputs).forEach(input => input.addEventListener('input', updateLink));

        inputs.minSpeed.addEventListener('input', () => { values.minSpeed.textContent = inputs.minSpeed.value; });
        inputs.maxSpeed.addEventListener('input', () => { values.maxSpeed.textContent = inputs.maxSpeed.value; });
        inputs.size.addEventListener('input', () => { values.size.textContent = inputs.size.value; });
        inputs.sat.addEventListener('input', () => { values.sat.textContent = inputs.sat.value; });
        inputs.light.addEventListener('input', () => { values.light.textContent = inputs.light.value; });

        copyLink.addEventListener('click', () => copyTextToClipboard(urlDisplay.value));

        // Initialize
        updateLink();
    </script>
</body>
</html>
