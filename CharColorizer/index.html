<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цветной Рассказ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .letter {
            display: inline-block;
            font-weight: bold;
            padding: 5px;
            animation-name: colorCycle;
            animation-timing-function: linear; /* overridden per-letter for instant mode */
            animation-iteration-count: infinite;
        }

        .letter.instant {
            animation-timing-function: steps(6, end);
        }

        .word {
            display: inline-block;
            white-space: nowrap;
            margin-right: 10px;
        }

        @keyframes colorCycle {
            0%   { color: hsl(0,   var(--sat), var(--light)); }
            16%  { color: hsl(60,  var(--sat), var(--light)); }
            33%  { color: hsl(120, var(--sat), var(--light)); }
            50%  { color: hsl(180, var(--sat), var(--light)); }
            66%  { color: hsl(240, var(--sat), var(--light)); }
            83%  { color: hsl(300, var(--sat), var(--light)); }
            100% { color: hsl(360, var(--sat), var(--light)); }
        }

        #story-container {
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <h1 class="text-center mb-4">🌈 Цветной Рассказ 🌈</h1>

        <div class="text-center mb-3">
            <button id="fullscreen-btn" class="btn btn-primary">Full Screen</button>
        </div>

        <div id="story-container"></div>

        <p class="text-center mt-3 text-muted">Попробуйте прочитать рассказ!</p>
    </div>

    <script>
        const defaultConfig = {
            storyText: "Вечер был тихим. Солнце медленно садилось за горизонт. На небе появились первые звёзды. Лёгкий ветерок шелестел листвой деревьев. Наступила прохлада.",
            containerId: 'story-container',
            animation: {
                minDuration: 1, // seconds
                maxDuration: 5  // seconds
            },
            style: {
                fontSize: '2.5rem',
                saturation: 100, // percent
                lightness: 50,   // percent
                backgroundColor: '#000000',
                backgroundImage: ''
            }
        };

        const params = new URLSearchParams(window.location.search);
        const config = {
            ...defaultConfig,
            animation: { ...defaultConfig.animation },
            style: { ...defaultConfig.style }
        };

        config.storyText = params.get('text') || defaultConfig.storyText;
        config.animation.minDuration = parseFloat(params.get('min')) || defaultConfig.animation.minDuration;
        config.animation.maxDuration = parseFloat(params.get('max')) || defaultConfig.animation.maxDuration;
        config.animation.mode = params.get('mode') || 'gradient'; // 'gradient' or 'instant'
        config.style.fontSize = params.get('size') ? `${params.get('size')}rem` : defaultConfig.style.fontSize;
        config.style.saturation = params.get('sat') !== null && params.get('sat') !== '' ? parseInt(params.get('sat')) : defaultConfig.style.saturation;
        config.style.lightness = params.get('light') !== null && params.get('light') !== '' ? parseInt(params.get('light')) : defaultConfig.style.lightness;
        config.style.backgroundColor = params.get('bgcolor') ? `#${params.get('bgcolor')}` : defaultConfig.style.backgroundColor;
        config.style.backgroundImage = params.get('bg') ? `url(${params.get('bg')})` : defaultConfig.style.backgroundImage;

        // Apply CSS variables for keyframe color stops
        document.documentElement.style.setProperty('--sat', `${config.style.saturation}%`);
        document.documentElement.style.setProperty('--light', `${config.style.lightness}%`);

        const container = document.getElementById(config.containerId);
        document.body.style.setProperty('background-color', config.style.backgroundColor, 'important');
        if (config.style.backgroundImage) {
            document.body.style.setProperty('background-image', config.style.backgroundImage, 'important');
            document.body.style.setProperty('background-size', 'cover', 'important');
            document.body.style.setProperty('background-position', 'center', 'important');
        }

        const words = config.storyText.split(' ');

        words.forEach(word => {
            const wordSpan = document.createElement('span');
            wordSpan.classList.add('word');

            word.split('').forEach(char => {
                const letterSpan = document.createElement('span');
                letterSpan.textContent = char;
                letterSpan.classList.add('letter');
                if (config.animation.mode === 'instant') letterSpan.classList.add('instant');
                letterSpan.style.fontSize = config.style.fontSize;

                const durationRange = config.animation.maxDuration - config.animation.minDuration;
                const speed = (Math.random() * durationRange + config.animation.minDuration).toFixed(2);
                letterSpan.style.animationDuration = `${speed}s`;

                // Negative delay so each letter starts at a random point in the color cycle
                const delay = (-(Math.random() * parseFloat(speed))).toFixed(2);
                letterSpan.style.animationDelay = `${delay}s`;

                wordSpan.appendChild(letterSpan);
            });

            container.appendChild(wordSpan);
        });
    </script>

    <script>
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                fullscreenBtn.textContent = 'Full Screen';
            } else {
                fullscreenBtn.textContent = 'Exit Full Screen';
            }
        });
    </script>

</body>
</html>
