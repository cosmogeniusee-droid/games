<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройка игры "Состав числа — Домики"</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light vh-100">
    <div class="container-fluid h-100 py-4">
        <h1 class="mb-4 text-center">⚙️ Конфигуратор игры "Состав числа — Домики 🏠"</h1>
        <div class="row g-4 h-100">
            <!-- Левая колонка: Настройки -->
            <div class="col-lg-5 d-flex flex-column">
                <div class="card flex-grow-1">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Настройки</h5>

                        <div class="mb-3 p-2 border rounded bg-light">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" role="switch" id="allCombos">
                                <label class="form-check-label fw-bold" for="allCombos">Показать все комбинации одного числа</label>
                            </div>
                            <small class="text-muted">Один домик с одним числом и всеми вариантами его состава (0+N, 1+(N−1), …).</small>
                        </div>

                        <div class="mb-3">
                            <label for="customNumbersInput" class="form-label"><span id="customNumbersLabel">Числа на крышах (через запятую, например: 5,7,10):</span></label>
                            <input type="text" id="customNumbersInput" class="form-control" placeholder="Если пусто, числа выберутся случайно">
                        </div>

                        <div class="mb-3" id="range-group">
                            <div class="mb-3">
                                <label for="min" class="form-label">Мин. число на крыше: <span id="minValue" class="fw-bold text-primary">5</span></label>
                                <input type="range" id="min" class="form-range" value="5" min="2" max="20">
                            </div>
                            <div class="mb-3">
                                <label for="max" class="form-label">Макс. число на крыше: <span id="maxValue" class="fw-bold text-primary">10</span></label>
                                <input type="range" id="max" class="form-range" value="10" min="2" max="20">
                            </div>
                            <div class="mb-0" id="houses-group">
                                <label for="houses" class="form-label">Количество домиков: <span id="housesValue" class="fw-bold text-primary">3</span></label>
                                <input type="range" id="houses" class="form-range" value="3" min="1" max="8">
                            </div>
                        </div>

                        <div class="mb-3" id="floors-group">
                            <label for="floors" class="form-label">Этажей (окошек) в домике: <span id="floorsValue" class="fw-bold text-primary">4</span></label>
                            <input type="range" id="floors" class="form-range" value="4" min="1" max="10">
                        </div>

                        <div class="mb-3">
                            <label for="cellSize" class="form-label">Размер окошек: <span id="cellSizeValue" class="fw-bold text-primary">70</span>px</label>
                            <input type="range" id="cellSize" class="form-range" value="70" min="40" max="110" step="5">
                        </div>

                        <hr>
                        <div class="mt-auto">
                            <div class="mb-3">
                                <label for="urlDisplay" class="form-label">Сгенерированная ссылка:</label>
                                <div class="input-group">
                                    <input type="text" id="urlDisplay" class="form-control" readonly>
                                    <button class="btn btn-outline-secondary" type="button" id="copyBtn">Копировать</button>
                                </div>
                            </div>
                            <a id="gameLink" href="#" target="_blank" class="btn btn-success w-100">🚀 Открыть игру в новой вкладке</a>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Правая колонка: Превью -->
            <div class="col-lg-7 d-flex flex-column">
                <div class="card flex-grow-1">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Превью</h5>
                        <div class="flex-grow-1 border rounded overflow-hidden">
                            <iframe id="previewFrame" src="" title="Превью игры" class="w-100 h-100 border-0"></iframe>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inputs = {
            customNumbers: document.getElementById('customNumbersInput'),
            min: document.getElementById('min'),
            max: document.getElementById('max'),
            houses: document.getElementById('houses'),
            floors: document.getElementById('floors'),
            cellSize: document.getElementById('cellSize'),
        };

        const valueDisplays = {
            min: document.getElementById('minValue'),
            max: document.getElementById('maxValue'),
            houses: document.getElementById('housesValue'),
            floors: document.getElementById('floorsValue'),
            cellSize: document.getElementById('cellSizeValue'),
        };

        const allCombosToggle = document.getElementById('allCombos');
        const customNumbersLabel = document.getElementById('customNumbersLabel');
        const urlDisplay = document.getElementById('urlDisplay');
        const gameLink = document.getElementById('gameLink');
        const copyBtn = document.getElementById('copyBtn');
        const previewFrame = document.getElementById('previewFrame');
        const rangeGroup = document.getElementById('range-group');
        const housesGroup = document.getElementById('houses-group');
        const floorsGroup = document.getElementById('floors-group');

        // Управляет видимостью блоков в зависимости от режима и введённых чисел
        function updateVisibility() {
            const allCombos = allCombosToggle.checked;
            const hasCustom = inputs.customNumbers.value.trim() !== '';

            // min/max нужны, только если числа не заданы вручную
            rangeGroup.style.display = hasCustom ? 'none' : 'block';

            // В режиме «все комбинации» домик всегда один и этажи считаются автоматически
            housesGroup.style.display = allCombos ? 'none' : 'block';
            floorsGroup.style.display = allCombos ? 'none' : 'block';

            // В режиме «все комбинации» берётся только одно число
            customNumbersLabel.textContent = allCombos
                ? 'Число (если несколько — возьмётся первое):'
                : 'Числа на крышах (через запятую, например: 5,7,10):';
            inputs.customNumbers.placeholder = allCombos
                ? 'Если пусто, число выберется случайно'
                : 'Если пусто, числа выберутся случайно';
        }

        function updateValueDisplays() {
            valueDisplays.min.textContent = inputs.min.value;
            valueDisplays.max.textContent = inputs.max.value;
            valueDisplays.houses.textContent = inputs.houses.value;
            valueDisplays.floors.textContent = inputs.floors.value;
            valueDisplays.cellSize.textContent = inputs.cellSize.value;

            if (parseInt(inputs.max.value) < parseInt(inputs.min.value)) {
                inputs.max.value = inputs.min.value;
                valueDisplays.max.textContent = inputs.max.value;
            }
        }

        function updateLink() {
            const baseUrl = 'index.html';
            const params = new URLSearchParams();
            const allCombos = allCombosToggle.checked;

            // Числа на крышах: оставляем только цифры и запятые
            const customNumbersValue = inputs.customNumbers.value
                .replace(/[^0-9,]/g, '')
                .split(',')
                .map(n => n.trim())
                .filter(n => n !== '')
                .join(',');

            if (allCombos) params.set('allCombos', '1');

            if (customNumbersValue) {
                params.set('numbers', customNumbersValue);
            } else {
                if (inputs.min.value !== '5') params.set('min', inputs.min.value);
                if (inputs.max.value !== '10') params.set('max', inputs.max.value);
            }

            // Домики и этажи не применяются в режиме «все комбинации»
            if (!allCombos) {
                if (inputs.houses.value !== '3') params.set('houses', inputs.houses.value);
                if (inputs.floors.value !== '4') params.set('floors', inputs.floors.value);
            }
            if (inputs.cellSize.value !== '70') params.set('cellSize', inputs.cellSize.value);

            const queryString = params.toString();
            const previewUrl = queryString ? `${baseUrl}?${queryString}` : baseUrl;
            const fullUrl = `https://cosmogeniusee-droid.github.io/games/NumberHouses/${previewUrl}`;
            urlDisplay.value = fullUrl;
            gameLink.href = previewUrl;
            previewFrame.src = previewUrl;
        }

        function copyTextToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = copyBtn.textContent;
                copyBtn.textContent = 'Скопировано!';
                setTimeout(() => { copyBtn.textContent = originalText; }, 2000);
            }).catch(err => console.error('Ошибка копирования: ', err));
        }

        Object.values(inputs).forEach(input => {
            input.addEventListener('input', () => {
                updateValueDisplays();
                updateLink();
            });
        });

        inputs.customNumbers.addEventListener('input', updateVisibility);

        allCombosToggle.addEventListener('change', () => {
            updateVisibility();
            updateLink();
        });

        copyBtn.addEventListener('click', () => copyTextToClipboard(urlDisplay.value));

        updateVisibility();
        updateValueDisplays();
        updateLink();
    </script>
</body>
</html>
