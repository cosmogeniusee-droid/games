<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конфигуратор игры "Пиктограммы"</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .word-btn {
            cursor: pointer;
            border: 2px dashed #adb5bd;
            border-radius: 8px;
            padding: 2px 8px;
            margin: 3px;
            display: inline-block;
            font-size: 1.1rem;
            background: #f8f9fa;
            transition: background 0.15s, border-color 0.15s;
            user-select: none;
        }
        .word-btn:hover {
            background: #e9ecef;
            border-color: #6c757d;
        }
        .word-btn.has-emoji {
            background: #fff9c4;
            border-color: #f9a825;
            border-style: solid;
        }
        .word-btn .badge-emoji {
            margin-left: 4px;
            font-size: 1.1em;
        }

        #word-cloud {
            min-height: 60px;
            padding: 8px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            background: #fff;
        }

        #emoji-popup {
            display: none;
            position: absolute;
            z-index: 1000;
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            padding: 12px;
            width: 320px;
        }

        #emoji-search {
            font-size: 0.9rem;
        }

        #emoji-category-tabs {
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .emoji-cat-btn {
            background: none;
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 2px 6px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background 0.1s;
        }
        .emoji-cat-btn:hover { background: #f0f0f0; }
        .emoji-cat-btn.active { background: #fff9c4; border-color: #f9a825; }

        #emoji-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            max-height: 180px;
            overflow-y: auto;
            padding: 4px 0;
        }

        .emoji-item {
            font-size: 1.5em;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.1s, transform 0.1s;
            user-select: none;
        }
        .emoji-item:hover {
            background: #fff9c4;
            transform: scale(1.2);
        }
        .emoji-item.selected {
            background: #c8e6c9;
            outline: 2px solid #388e3c;
        }

        #raw-text {
            font-family: monospace;
            font-size: 0.85rem;
        }
    </style>
</head>

        // Extract unique words (preserving case) from plain text
        function extractWords(text) {
            const seen = new Set();
            const result = [];
            // Split on non-letter sequences; keep only Cyrillic/Latin words
            const words = text.match(/[a-zA-Zа-яА-ЯёЁ]+/g) || [];
            words.forEach(w => {
                const key = w.toLowerCase();
                if (!seen.has(key)) {
                    seen.add(key);
                    result.push(w);
                }
            });
            return result;
        }

        // Build the markup text with {word|emoji} substitutions
        function buildMarkupText(plainText) {
            // Replace occurrences of mapped words (case-insensitive, whole word)
            let result = plainText;
            // Build sorted list by length desc to avoid partial replacements
            const entries = [...emojiMap.entries()].sort((a, b) => b[0].length - a[0].length);
            entries.forEach(([word, emoji]) => {
                // Escape for regex
                const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const re = new RegExp(`(?<![a-zA-Zа-яА-ЯёЁ])${escaped}(?![a-zA-Zа-яА-ЯёЁ])`, 'gi');
                result = result.replace(re, matched => `{${matched}|${emoji}}`);
            });
            return result;
        }

                const btn = document.createElement('span');
                btn.className = 'word-btn' + (emoji ? ' has-emoji' : '');
                btn.textContent = word;
                if (emoji) {
                    const badge = document.createElement('span');
                    badge.className = 'badge-emoji';
                    if (/^https?:\/\//i.test(emoji)) {
                        const img = document.createElement('img');
                        img.src = emoji;
                        img.alt = '';
                        img.style.cssText = 'height:1.2em;width:auto;vertical-align:middle;border-radius:3px;';
                        badge.appendChild(img);
                    } else {
                        badge.textContent = emoji;
                    }
                    btn.appendChild(badge);
                }

                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openPopup(word, btn);
                });

                wordCloud.appendChild(btn);
            });
        }

        function renderEmojiCategoryTabs() {
            emojiCategoryTabs.innerHTML = '';
            EMOJI_CATEGORIES.forEach((cat, i) => {
                const btn = document.createElement('button');
                btn.className = 'emoji-cat-btn' + (i === activeCategoryIndex ? ' active' : '');
                btn.textContent = cat.icon;
                btn.title = cat.label;
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    activeCategoryIndex = i;
                    emojiSearch.value = '';
                    renderEmojiCategoryTabs();
                    renderEmojiGrid();
                });
                emojiCategoryTabs.appendChild(btn);
            });
        }

        function renderEmojiGrid(filter = '') {
            emojiGrid.innerHTML = '';
            const currentEmoji = emojiInput.value.trim();
            let emojis;
            if (filter) {
                // Filter by matching emoji characters typed in search
                const allEmojis = EMOJI_CATEGORIES.flatMap(c => c.emojis).filter((e, i, arr) => arr.indexOf(e) === i);
                emojis = allEmojis.filter(e => e.includes(filter));
                if (emojis.length === 0) emojis = allEmojis; // fallback: show all
            } else {
                emojis = EMOJI_CATEGORIES[activeCategoryIndex].emojis;
            }

            emojis.forEach(em => {
                const item = document.createElement('span');
                item.className = 'emoji-item' + (em === currentEmoji ? ' selected' : '');
                item.textContent = em;
                item.title = em;
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    emojiInput.value = em;
                    // Update selection highlight
                    emojiGrid.querySelectorAll('.emoji-item').forEach(el => el.classList.toggle('selected', el.textContent === em));
                });
                emojiGrid.appendChild(item);
            });
        }

        function openPopup(word, anchorEl) {
            currentPopupWord = word;
            popupWordLabel.textContent = `«${word}»`;
            const existing = [...emojiMap.entries()].find(([k]) => k.toLowerCase() === word.toLowerCase())?.[1] || '';
            emojiSearch.value = '';
            activeCategoryIndex = 0;

            if (/^https?:\/\//i.test(existing)) {
                imageUrlInput.value = existing;
                imagePreview.src = existing;
                imagePreview.style.display = '';
                imagePreviewError.style.display = 'none';
                switchPopupTab('url');
            } else {
                emojiInput.value = existing;
                imageUrlInput.value = '';
                imagePreview.style.display = 'none';
                switchPopupTab('emoji');
            }

            renderEmojiCategoryTabs();
            renderEmojiGrid();

            // Position near the button
            const rect = anchorEl.getBoundingClientRect();
            const containerRect = anchorEl.closest('.card-body').getBoundingClientRect();
            emojiPopup.style.top = (rect.bottom - containerRect.top + 4) + 'px';
            emojiPopup.style.left = (rect.left - containerRect.left) + 'px';
            emojiPopup.style.display = 'block';
            emojiInput.focus();
        }

        function closePopup() {
            emojiPopup.style.display = 'none';
            currentPopupWord = null;
        }

        popupApply.addEventListener('click', () => {
            const value = activePopupTab === 'url'
                ? imageUrlInput.value.trim()
                : emojiInput.value.trim();
            if (currentPopupWord && value) {
                // Remove any existing entry for this word (case-insensitive)
                [...emojiMap.keys()].forEach(k => {
                    if (k.toLowerCase() === currentPopupWord.toLowerCase()) emojiMap.delete(k);
                });
                emojiMap.set(currentPopupWord, value);
                closePopup();
                renderWordCloud();
                updateLink();
            }
        });

        emojiInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') popupApply.click();
            if (e.key === 'Escape') closePopup();
        });

        // Update grid selection when user types manually in the input
        emojiInput.addEventListener('input', () => {
            emojiGrid.querySelectorAll('.emoji-item').forEach(el =>
                el.classList.toggle('selected', el.textContent === emojiInput.value.trim())
            );
        });

        emojiSearch.addEventListener('input', (e) => {
            e.stopPropagation();
            renderEmojiGrid(emojiSearch.value.trim());
        });

        emojiSearch.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closePopup();
        });

        popupRemove.addEventListener('click', () => {
            if (currentPopupWord) {
                [...emojiMap.keys()].forEach(k => {
                    if (k.toLowerCase() === currentPopupWord.toLowerCase()) emojiMap.delete(k);
                });
                closePopup();
                renderWordCloud();
                updateLink();
            }
        });

        popupClose.addEventListener('click', closePopup);
        document.addEventListener('click', (e) => {
            if (!emojiPopup.contains(e.target) && !e.target.classList.contains('word-btn')) {
                closePopup();
            }
        });

        function updateLink() {
            const markupText = buildMarkupText(textInput.value);
            rawTextArea.value = markupText;

            const baseUrl = 'index.html';
            const urlParams = new URLSearchParams();

            urlParams.set('text', markupText);
            if (sizeInput.value !== '1.6') urlParams.set('size', sizeInput.value);
            if (colorInput.value !== '#333333') urlParams.set('color', colorInput.value.substring(1));
            if (bgColorInput.value !== '#fffde7') urlParams.set('bgcolor', bgColorInput.value.substring(1));
            if (bgInput.value) urlParams.set('bg', bgInput.value);

            const queryString = urlParams.toString();
            const previewUrl = queryString ? `${baseUrl}?${queryString}` : baseUrl;
            const fullUrl = `https://cosmogeniusee-droid.github.io/games/Pictograms/${previewUrl}`;

            urlDisplay.value = fullUrl;
            gameLink.href = previewUrl;
            previewFrame.src = previewUrl;
        }

        textInput.addEventListener('input', () => {
            // Remove emoji assignments for words no longer in text
            const currentWords = new Set((textInput.value.match(/[a-zA-Zа-яА-ЯёЁ]+/g) || []).map(w => w.toLowerCase()));
            [...emojiMap.keys()].forEach(k => {
                if (!currentWords.has(k.toLowerCase())) emojiMap.delete(k);
            });
            renderWordCloud();
            updateLink();
        });

        sizeInput.addEventListener('input', () => { sizeValue.textContent = sizeInput.value; updateLink(); });
        colorInput.addEventListener('input', updateLink);
        bgColorInput.addEventListener('input', updateLink);
        bgInput.addEventListener('input', updateLink);

        copyLink.addEventListener('click', () => {
            navigator.clipboard.writeText(urlDisplay.value).then(() => {
                const orig = copyLink.textContent;
                copyLink.textContent = 'Скопировано!';
                setTimeout(() => { copyLink.textContent = orig; }, 2000);
            });
        });

        // Init
        renderWordCloud();
        updateLink();
    </script>
</body>
</html>
