<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пиктограммы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #fffde7;
        }

        #story-container {
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            text-align: center;
            padding: 20px;
            line-height: 2;
        }

        .token {
            display: inline;
            white-space: pre-wrap;
        }

        .pictogram {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            margin: 2px 4px;
            vertical-align: middle;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .pictogram .emoji {
            display: inline-block;
            background: #fff9c4;
            border: 2px solid #f9a825;
            border-radius: 12px;
            padding: 2px 6px;
            font-size: 1.8em;
            transition: transform 0.15s ease, background 0.15s ease;
            line-height: 1.2;
        }

        .pictogram .emoji img {
            display: block;
            height: 1.8em;
            width: auto;
            max-width: 4em;
            object-fit: contain;
            border-radius: 6px;
            pointer-events: none;
        }

        .pictogram:hover .emoji,
        .pictogram:focus .emoji {
            background: #fff176;
            transform: scale(1.15);
        }

        .pictogram .word-reveal {
            font-size: 0.55em;
            color: #e65100;
            font-weight: bold;
            margin-top: 2px;
            min-height: 1.2em;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .pictogram.revealed .word-reveal {
            opacity: 1;
        }

        .pictogram.revealed .emoji {
            background: #c8e6c9;
            border-color: #388e3c;
        }
    </style>
</head>
<body>

    <div class="container py-4">
        <h1 class="text-center mb-4">🖼️ Пиктограммы 🖼️</h1>

        <div class="text-center mb-3">
            <button id="fullscreen-btn" class="btn btn-primary me-2">Full Screen</button>
            <button id="reveal-all-btn" class="btn btn-outline-success">Показать все слова</button>
        </div>

        <div id="story-container"></div>

        <p class="text-center mt-3 text-muted">Нажмите на картинку, чтобы узнать слово.</p>
    </div>

    <script>
        const defaultConfig = {
            storyText: 'Маша взяла {корзину|🧺} и пошла в {лес|🌲}. Там она нашла {грибы|🍄} и {ягоды|🍓}. Дома {мама|👩} сварила вкусный {суп|🍲}.',
            style: {
                fontSize: '1.6rem',
                color: '#333333',
                backgroundColor: '#fffde7',
                backgroundImage: ''
            }
        };

        const params = new URLSearchParams(window.location.search);

        const storyText = params.get('text') || defaultConfig.storyText;
        const fontSize   = params.get('size')   ? `${params.get('size')}rem` : defaultConfig.style.fontSize;
        const color      = params.get('color')  ? `#${params.get('color')}` : defaultConfig.style.color;
        const bgColor    = params.get('bgcolor')? `#${params.get('bgcolor')}` : defaultConfig.style.backgroundColor;
        const bgImage    = params.get('bg')     ? `url(${params.get('bg')})` : defaultConfig.style.backgroundImage;

        document.body.style.setProperty('background-color', bgColor, 'important');
        if (bgImage) {
            document.body.style.setProperty('background-image', bgImage, 'important');
            document.body.style.setProperty('background-size', 'cover', 'important');
            document.body.style.setProperty('background-position', 'center', 'important');
        }

        const container = document.getElementById('story-container');
        container.style.fontSize = fontSize;
        container.style.color = color;

        // Parse text: tokens are either {word|emoji} or plain text segments
        const tokenRegex = /\{([^|}]+)\|([^}]+)\}|([^{]+)/g;
        let match;
        while ((match = tokenRegex.exec(storyText)) !== null) {
            if (match[3] !== undefined) {
                // Plain text
                const span = document.createElement('span');
                span.className = 'token';
                span.textContent = match[3];
                container.appendChild(span);
            } else {
                // Pictogram {word|emoji_or_url}
                const word  = match[1];
                const value = match[2];
                const isUrl = /^https?:\/\//i.test(value);

                const wrapper = document.createElement('span');
                wrapper.className = 'pictogram';
                wrapper.setAttribute('role', 'button');
                wrapper.setAttribute('tabindex', '0');
                wrapper.setAttribute('aria-label', word);

                const emojiSpan = document.createElement('span');
                emojiSpan.className = 'emoji';
                if (isUrl) {
                    const img = document.createElement('img');
                    img.src = value;
                    img.alt = word;
                    emojiSpan.appendChild(img);
                } else {
                    emojiSpan.textContent = value;
                }

                const wordSpan = document.createElement('span');
                wordSpan.className = 'word-reveal';
                wordSpan.textContent = word;

                wrapper.appendChild(emojiSpan);
                wrapper.appendChild(wordSpan);

                wrapper.addEventListener('click', () => wrapper.classList.toggle('revealed'));
                wrapper.addEventListener('keydown', e => {
                    if (e.key === 'Enter' || e.key === ' ') wrapper.classList.toggle('revealed');
                });

                container.appendChild(wrapper);
            }
        }

        // Reveal all toggle
        const revealBtn = document.getElementById('reveal-all-btn');
        let allRevealed = false;
        revealBtn.addEventListener('click', () => {
            allRevealed = !allRevealed;
            document.querySelectorAll('.pictogram').forEach(p => p.classList.toggle('revealed', allRevealed));
            revealBtn.textContent = allRevealed ? 'Скрыть все слова' : 'Показать все слова';
        });

        // Fullscreen
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        });
        document.addEventListener('fullscreenchange', () => {
            fullscreenBtn.textContent = document.fullscreenElement ? 'Exit Full Screen' : 'Full Screen';
        });
    </script>
</body>
</html>
