<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конфигуратор игры "Словесные прятки"</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h1 class="mb-2">📝 Конфигуратор игры "Словесные прятки"</h1>
        <p class="text-muted mb-4">Введите предложение с пробелами — игра уберёт их, а ребёнок должен найти границы слов.</p>

        <div class="row g-4">
            <!-- Левая колонка -->
            <div class="col-lg-5">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Настройки</h5>

                        <div class="mb-3">
                            <label for="textInput" class="form-label">Предложение (слова через пробел):</label>
                            <input type="text" id="textInput" class="form-control" value="МАМА МЫЛА РАМУ">
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small">Предпросмотр слиплись:</label>
                            <div id="preview-merged" class="form-control bg-white fw-bold letter-spacing-wide" style="font-size:1.1rem;min-height:2.4rem;word-break:break-all;"></div>
                        </div>

                        <div class="mb-3">
                            <label for="sizeInput" class="form-label">Размер букв: <span id="sizeValue">2.5</span>rem</label>
                            <input type="range" id="sizeInput" class="form-range" min="1" max="5" step="0.1" value="2.5">
                        </div>

                        <div class="mb-3">
                            <label for="colorInput" class="form-label">Цвет текста:</label>
                            <input type="color" id="colorInput" class="form-control form-control-color" value="#333333">
                        </div>

                        <div class="mb-3">
                            <label for="bgColorInput" class="form-label">Цвет фона:</label>
                            <input type="color" id="bgColorInput" class="form-control form-control-color" value="#f0f4ff">
                        </div>

                        <div class="mb-3">
                            <label for="bgInput" class="form-label">URL фонового изображения (необязательно):</label>
                            <input type="url" id="bgInput" class="form-control" placeholder="https://example.com/background.jpg">
                        </div>

                        <hr>

                        <div class="mb-3">
                            <label for="urlDisplay" class="form-label">Сгенерированная ссылка:</label>
                            <div class="input-group">
                                <input type="text" id="urlDisplay" class="form-control" readonly>
                                <button class="btn btn-outline-secondary" type="button" id="copyLink">Копировать</button>
                            </div>
                        </div>

                        <a id="gameLink" href="#" target="_blank" class="btn btn-success w-100">🚀 Открыть игру в новой вкладке</a>
                    </div>
                </div>
            </div>

            <!-- Правая колонка: Превью -->
            <div class="col-lg-7">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Превью</h5>
                        <div class="ratio ratio-1x1 border rounded">
                            <iframe id="previewFrame" src="" title="Превью игры"></iframe>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const textInput    = document.getElementById('textInput');
        const previewMerged= document.getElementById('preview-merged');
        const sizeInput    = document.getElementById('sizeInput');
        const sizeValue    = document.getElementById('sizeValue');
        const colorInput   = document.getElementById('colorInput');
        const bgColorInput = document.getElementById('bgColorInput');
        const bgInput      = document.getElementById('bgInput');
        const urlDisplay   = document.getElementById('urlDisplay');
        const gameLink     = document.getElementById('gameLink');
        const copyLink     = document.getElementById('copyLink');
        const previewFrame = document.getElementById('previewFrame');

        function updateMergedPreview() {
            previewMerged.textContent = textInput.value.trim().replace(/\s+/g, '');
        }

        function updateLink() {
            updateMergedPreview();

            const baseUrl = 'index.html';
            const urlParams = new URLSearchParams();

            const defaultText = 'МАМА МЫЛА РАМУ';
            if (textInput.value.trim() !== defaultText) urlParams.set('text', textInput.value.trim());
            if (sizeInput.value !== '2.5') urlParams.set('size', sizeInput.value);
            if (colorInput.value !== '#333333') urlParams.set('color', colorInput.value.substring(1));
            if (bgColorInput.value !== '#f0f4ff') urlParams.set('bgcolor', bgColorInput.value.substring(1));
            if (bgInput.value) urlParams.set('bg', bgInput.value);

            const queryString = urlParams.toString();
            const previewUrl = queryString ? `${baseUrl}?${queryString}` : baseUrl;
            const fullUrl = `https://cosmogeniusee-droid.github.io/games/WordHide/${previewUrl}`;

            urlDisplay.value = fullUrl;
            gameLink.href = previewUrl;
            previewFrame.src = previewUrl;
        }

        textInput.addEventListener('input', updateLink);
        sizeInput.addEventListener('input', () => { sizeValue.textContent = sizeInput.value; updateLink(); });
        colorInput.addEventListener('input', updateLink);
        bgColorInput.addEventListener('input', updateLink);
        bgInput.addEventListener('input', updateLink);

        copyLink.addEventListener('click', () => {
            navigator.clipboard.writeText(urlDisplay.value).then(() => {
                const orig = copyLink.textContent;
                copyLink.textContent = 'Скопировано!';
                setTimeout(() => { copyLink.textContent = orig; }, 2000);
            });
        });

        updateLink();
    </script>
</body>
</html>
