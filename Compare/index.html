<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Больше, меньше или равно?</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #ede7f6;
            overflow-x: hidden;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* ── Сравнение: две стороны и знак между ними ──────────── */
        #compare-area {
            --pad: 110px; /* базовый размер «карточки» стороны */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: nowrap;
            min-height: calc(var(--pad) * 2.2);
            margin: 10px 0 4px;
        }

        .side {
            flex: 0 1 auto;
            min-width: var(--pad);
            min-height: var(--pad);
            max-width: 42vw;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fff;
            border: 4px solid #7e57c2;
            border-radius: 20px;
            box-shadow: 0 6px 0 #b39ddb;
        }

        /* Число крупно */
        .side .big-number {
            font-size: 4.5rem;
            font-weight: 800;
            color: #4527a0;
            line-height: 1;
        }

        /* Набор предметов для подсчёта */
        .side .items {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            align-content: center;
            max-width: 38vw;
        }
        .side .items span {
            font-size: 2.9rem;
            line-height: 1;
        }

        /* Слот для знака (между сторонами) */
        #sign-slot {
            width: 90px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: 900;
            color: #90a4ae;
            background: #faf7ff;
            border: 4px dashed #9575cd;
            border-radius: 18px;
            flex: 0 0 auto;
            transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.15s;
        }
        #sign-slot.filled { color: #4527a0; }
        #sign-slot.correct {
            background: #c8e6c9;
            border-color: #388e3c;
            border-style: solid;
            color: #1b5e20;
            transform: scale(1.08);
        }
        #sign-slot.wrong {
            background: #ffcdd2;
            border-color: #c62828;
            color: #b71c1c;
            animation: shake 0.35s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        /* ── Кнопки выбора знака ───────────────────────────────── */
        #choices {
            display: flex;
            gap: 16px;
            justify-content: center;
            padding: 16px 12px;
        }
        .sign-btn {
            width: 96px;
            height: 96px;
            font-size: 3.4rem;
            font-weight: 900;
            color: #fff;
            background: linear-gradient(145deg, #7e57c2, #5e35b1);
            border: none;
            border-radius: 18px;
            box-shadow: 0 6px 0 #4527a0, 0 8px 10px rgba(0,0,0,.2);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s, opacity 0.2s;
            user-select: none;
        }
        .sign-btn:hover:not(:disabled) { background: linear-gradient(145deg, #9575cd, #7e57c2); }
        .sign-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 #4527a0; }
        .sign-btn:disabled { opacity: 0.4; cursor: default; }
        .sign-btn.wrong-choice {
            background: linear-gradient(145deg, #ef5350, #e53935);
            opacity: 0.5; pointer-events: none;
        }

        /* ── Прогресс / UI ─────────────────────────────────────── */
        #progress-bar-wrap {
            height: 10px;
            background: #d1c4e9;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 6px;
        }
        #progress-bar {
            height: 100%;
            background: #7e57c2;
            border-radius: 5px;
            transition: width 0.4s ease;
        }

        @media (max-width: 640px) {
            .side .big-number { font-size: 3rem; }
            .side .items span { font-size: 2rem; }
            #sign-slot { width: 64px; height: 64px; font-size: 2.6rem; }
            .sign-btn { width: 74px; height: 74px; font-size: 2.6rem; }
        }
    </style>
</head>
<body>

<div class="container py-3">
    <h1 class="text-center mb-2">⚖️ Больше, меньше или равно?</h1>

    <div class="d-flex justify-content-between align-items-center mb-1">
        <span id="progress-text" class="text-muted small"></span>
        <div class="d-flex gap-2">
            <span id="score" class="badge bg-success align-self-center fs-6">⭐ 0</span>
            <span id="errors" class="badge bg-danger align-self-center fs-6">❌ 0</span>
            <button id="fullscreen-btn" class="btn btn-sm btn-primary">Full Screen</button>
        </div>
    </div>
    <div id="progress-bar-wrap"><div id="progress-bar" style="width:0%"></div></div>

    <!-- Сравнение -->
    <div id="compare-area">
        <div id="left" class="side"></div>
        <div id="sign-slot">?</div>
        <div id="right" class="side"></div>
    </div>

    <p class="text-center text-muted small mb-1">Какой знак подходит? 👇</p>

    <!-- Кнопки знаков -->
    <div id="choices">
        <button class="sign-btn" data-sign="&lt;">&lt;</button>
        <button class="sign-btn" data-sign="=">=</button>
        <button class="sign-btn" data-sign="&gt;">&gt;</button>
    </div>
</div>

<!-- Start overlay -->
<div id="start-overlay" style="position:fixed;inset:0;background:rgba(237,231,246,0.97);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;">
    <div style="font-size:5rem;margin-bottom:16px;">⚖️</div>
    <h2 style="margin-bottom:24px;color:#4527a0;">Больше, меньше или равно?</h2>
    <button id="start-btn" style="font-size:1.6rem;padding:16px 48px;border:none;border-radius:16px;background:linear-gradient(145deg,#5e35b1,#7e57c2);color:#fff;box-shadow:0 6px 0 #4527a0,0 8px 16px rgba(0,0,0,.2);cursor:pointer;">▶ Начать игру</button>
</div>

<!-- Win overlay -->
<div id="win-overlay" style="position:fixed;inset:0;background:rgba(237,231,246,0.97);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:999;">
    <div style="font-size:5rem;margin-bottom:16px;">🎉⚖️🎉</div>
    <h2 style="margin-bottom:8px;color:#4527a0;">Молодец!</h2>
    <p id="win-score" style="font-size:1.4rem;color:#2e7d32;margin-bottom:24px;"></p>
    <button id="again-btn" style="font-size:1.4rem;padding:14px 40px;border:none;border-radius:16px;background:linear-gradient(145deg,#43a047,#66bb6a);color:#fff;box-shadow:0 6px 0 #2e7d32,0 8px 16px rgba(0,0,0,.2);cursor:pointer;">↻ Ещё раз</button>
</div>

<script>
    // ── Настройки из URL ────────────────────────────────────────
    const params = new URLSearchParams(window.location.search);

    // mode: numbers | items | both
    const MODE = ['numbers','items','both'].includes(params.get('mode')) ? params.get('mode') : 'numbers';
    const MIN = parseInt(params.get('min') ?? '0', 10);
    const MAX = parseInt(params.get('max') ?? '10', 10);
    const COUNT = parseInt(params.get('count') ?? '10', 10);
    // Набор эмодзи для режима подсчёта предметов
    const EMOJIS = (params.get('emojis') || '🍎,🍌,⭐,🐱,🐟,🎈,🚗,🌼')
        .split(',').map(s => s.trim()).filter(Boolean);

    const bgColor = params.get('bgcolor') ? `#${params.get('bgcolor')}` : '#ede7f6';
    document.body.style.setProperty('background-color', bgColor, 'important');

    // ── Состояние ───────────────────────────────────────────────
    let roundIdx = 0;
    let score = 0;
    let errorCount = 0;
    let currentAnswer = null; // '<', '>', '='

    const leftEl   = document.getElementById('left');
    const rightEl  = document.getElementById('right');
    const signSlot = document.getElementById('sign-slot');
    const choicesWrap = document.getElementById('choices');
    const progressBar  = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const scoreEl = document.getElementById('score');
    const errorsEl = document.getElementById('errors');

    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    // Режимы для левой и правой стороны текущего раунда.
    // numbers — обе числом; items — обе предметами;
    // both — одна сторона число, другая предметы (какая именно — случайно).
    function sideModes() {
        if (MODE === 'numbers') return ['numbers', 'numbers'];
        if (MODE === 'items')   return ['items', 'items'];
        // both: число против предметов
        return Math.random() < 0.5 ? ['numbers', 'items'] : ['items', 'numbers'];
    }

    function signFor(a, b) {
        if (a < b) return '<';
        if (a > b) return '>';
        return '=';
    }

    // Рисует одну сторону: число или набор предметов
    function renderSide(el, value, mode, emoji) {
        el.innerHTML = '';
        if (mode === 'numbers') {
            const n = document.createElement('div');
            n.className = 'big-number';
            n.textContent = value;
            el.appendChild(n);
        } else {
            const box = document.createElement('div');
            box.className = 'items';
            for (let i = 0; i < value; i++) {
                const s = document.createElement('span');
                s.textContent = emoji;
                box.appendChild(s);
            }
            el.appendChild(box);
        }
    }

    function renderRound() {
        const [leftMode, rightMode] = sideModes();
        let a = randInt(MIN, MAX);
        let b = randInt(MIN, MAX);

        // Иногда принудительно делаем равные, чтобы знак «=» встречался чаще
        if (Math.random() < 0.22) b = a;

        currentAnswer = signFor(a, b);

        // Если обе стороны — предметы, используем один и тот же эмодзи
        // (сравниваем количество одинаковых предметов).
        const bothItems = leftMode === 'items' && rightMode === 'items';
        const sharedEmoji = EMOJIS[randInt(0, EMOJIS.length - 1)] || '🍎';
        const leftEmoji  = sharedEmoji;
        const rightEmoji = bothItems ? sharedEmoji : (EMOJIS[randInt(0, EMOJIS.length - 1)] || '🍎');

        renderSide(leftEl, a, leftMode, leftEmoji);
        renderSide(rightEl, b, rightMode, rightEmoji);

        signSlot.textContent = '?';
        signSlot.className = '';

        // Сбрасываем кнопки
        [...choicesWrap.children].forEach(btn => {
            btn.disabled = false;
            btn.classList.remove('wrong-choice');
        });

        progressText.textContent = `Задание ${roundIdx + 1} из ${COUNT}`;
        progressBar.style.width = `${(roundIdx / COUNT) * 100}%`;
    }

    function onChoice(sign, btn) {
        if (sign === currentAnswer) {
            playCorrect();
            signSlot.textContent = sign;
            signSlot.classList.add('filled', 'correct');
            score++;
            scoreEl.textContent = `⭐ ${score}`;
            [...choicesWrap.children].forEach(b => b.disabled = true);
            setTimeout(() => {
                roundIdx++;
                if (roundIdx < COUNT) renderRound();
                else onGameComplete();
            }, 750);
        } else {
            playWrong();
            errorCount++;
            errorsEl.textContent = `❌ ${errorCount}`;
            btn.classList.add('wrong-choice');
            signSlot.classList.add('wrong');
            setTimeout(() => signSlot.classList.remove('wrong'), 400);
        }
    }

    function onGameComplete() {
        playFanfare();
        progressBar.style.width = '100%';
        progressText.textContent = '🎉 Все задания выполнены!';
        document.getElementById('win-score').textContent =
            `Правильных ответов: ${score} из ${COUNT} ⭐  Ошибок: ${errorCount} ❌`;
        document.getElementById('win-overlay').style.display = 'flex';
    }

    function startGame() {
        roundIdx = 0;
        score = 0;
        errorCount = 0;
        scoreEl.textContent = '⭐ 0';
        errorsEl.textContent = '❌ 0';
        renderRound();
    }

    // Кнопки знаков
    [...choicesWrap.children].forEach(btn => {
        btn.addEventListener('click', () => onChoice(btn.dataset.sign, btn));
    });

    // Fullscreen
    const fsBtn = document.getElementById('fullscreen-btn');
    fsBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    });
    document.addEventListener('fullscreenchange', () => {
        fsBtn.textContent = document.fullscreenElement ? 'Exit Full Screen' : 'Full Screen';
    });

    document.getElementById('start-btn').addEventListener('click', () => {
        if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
        if (actx.state !== 'running') actx.resume();
        document.getElementById('start-overlay').style.display = 'none';
        startGame();
    });
    document.getElementById('again-btn').addEventListener('click', () => {
        document.getElementById('win-overlay').style.display = 'none';
        startGame();
    });

    // Показать первый раунд под оверлеем
    renderRound();

    // ── Звук ────────────────────────────────────────────────────
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function readyCtx() { if (!actx) actx = new AudioCtx(); if (actx.state !== 'running') actx.resume(); return actx; }

    function playCorrect() {
        const ctx = readyCtx(); const t = ctx.currentTime + 0.01;
        const osc = ctx.createOscillator(), g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, t);
        osc.frequency.exponentialRampToValueAtTime(880, t + 0.12);
        g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        osc.start(t); osc.stop(t + 0.19);
    }
    function playWrong() {
        const ctx = readyCtx(); const t = ctx.currentTime + 0.01;
        const osc = ctx.createOscillator(), g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, t);
        osc.frequency.exponentialRampToValueAtTime(100, t + 0.25);
        g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        osc.start(t); osc.stop(t + 0.26);
    }
    function playFanfare() {
        const ctx = readyCtx(); const t0 = ctx.currentTime + 0.01;
        [523, 659, 784, 1047].forEach((f, i) => {
            const t = t0 + i * 0.18;
            const osc = ctx.createOscillator(), g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.type = 'triangle'; osc.frequency.value = f;
            g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.3, t + 0.04);
            g.gain.setValueAtTime(0.3, t + 0.12); g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
            osc.start(t); osc.stop(t + 0.36);
        });
    }
</script>
</body>
</html>
