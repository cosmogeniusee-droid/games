<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конфигуратор "Настольная игра"</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body { background: #f0f4ff; }
        .special-badge { font-size: 0.78em; padding: 2px 7px; border-radius: 6px; cursor: pointer; user-select: none; }
        #tasks-area { font-size: 0.88em; resize: vertical; }
        .player-row input { border-radius: 8px; }
        .preview-legend span { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: middle; margin-right: 4px; }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid py-4">
    <h1 class="mb-4 text-center">⚙️ Конфигуратор «Настольная игра»</h1>

    <div class="row g-4">
        <!-- ── Left column: settings ───────────────────────────────────── -->
        <div class="col-lg-5">
            <div class="card h-100">
                <div class="card-body d-flex flex-column gap-3">
                    <h5 class="card-title mb-0">Настройки</h5>

                    <!-- Title -->
                    <div>
                        <label for="titleInput" class="form-label fw-semibold">Название игры</label>
                        <input type="text" id="titleInput" class="form-control"
                               placeholder="Настольная игра" value="Настольная игра">
                    </div>

                    <!-- Cells -->
                    <div>
                        <label class="form-label fw-semibold">
                            Количество клеток: <span id="cellsVal" class="text-primary fw-bold">20</span>
                        </label>
                        <input type="range" id="cellsInput" class="form-range" min="6" max="50" value="20">
                        <small class="text-muted">Клеток для заданий: <span id="taskCellsCount" class="fw-bold">18</span> (без Старта и Финиша)</small>
                    </div>

                    <!-- Tasks -->
                    <div class="flex-grow-1 d-flex flex-column">
                        <label class="form-label fw-semibold">
                            Задания для клеток
                            <small class="text-muted fw-normal ms-1">(по одному на строку)</small>
                        </label>

                        <!-- Special cell buttons -->
                        <div class="d-flex flex-wrap gap-1 mb-2">
                            <span class="badge bg-warning text-dark special-badge" onclick="insertSpecial('!вперед:2')" title="Добавить особую клетку">⚡ Вперёд +2</span>
                            <span class="badge bg-info text-dark special-badge"    onclick="insertSpecial('!назад:2')"  title="Добавить особую клетку">🌀 Назад −2</span>
                            <span class="badge bg-light text-muted special-badge"   onclick="insertSpecial('')"          title="Пустая клетка (без задания)">⭕ Пустая</span>
                        </div>

                        <textarea id="tasks-area" class="form-control flex-grow-1"
                                  style="min-height:200px"
                                  placeholder="Назови 3 слова на букву М&#10;Посчитай от 10 до 1&#10;!вперед:2&#10;Расскажи стихотворение&#10;!пропуск"></textarea>
                        <small class="text-muted mt-1">
                            Задания назначаются на клетки по порядку (клетка 2, 3, 4…).
                            Пустая строка = свободная клетка.
                        </small>
                    </div>

                    <hr class="my-1">

                    <!-- Generated URL -->
                    <div>
                        <label class="form-label fw-semibold">Ссылка на игру</label>
                        <div class="input-group mb-2">
                            <input type="text" id="urlDisplay" class="form-control form-control-sm" readonly>
                            <button class="btn btn-outline-secondary btn-sm" id="copyBtn">Копировать</button>
                        </div>
                        <a id="gameLink" href="#" target="_blank" class="btn btn-success w-100">
                            🚀 Открыть игру в новой вкладке
                        </a>
                    </div>

                </div>
            </div>
        </div>

        <!-- ── Right column: preview ───────────────────────────────────── -->
        <div class="col-lg-7 d-flex flex-column">
            <div class="card flex-grow-1">
                <div class="card-body d-flex flex-column">
                    <div class="flex-grow-1 border rounded overflow-hidden" style="min-height:420px">
                        <iframe id="previewFrame" src="" title="Превью игры"
                                class="w-100 h-100 border-0" style="min-height:420px"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script>
// ─── Helpers ──────────────────────────────────────────────────────────────────
function encodeTasks(lines) {
    // Safe base64 for UTF-8 text
    return btoa(encodeURIComponent(JSON.stringify(lines)));
}

function buildUrl() {
    const base  = 'index.html';
    const title = document.getElementById('titleInput').value.trim() || 'Настольная игра';
    const cells = parseInt(document.getElementById('cellsInput').value);

    const raw   = document.getElementById('tasks-area').value;
    const lines = raw.split('\n');

    const params = new URLSearchParams({
        cells,
        title,
        tasks: encodeTasks(lines)
    });

    return `${base}?${params.toString()}`;
}

function refresh() {
    const url = buildUrl();
    document.getElementById('urlDisplay').value = url;
    document.getElementById('gameLink').href    = url;
    document.getElementById('previewFrame').src = url;
}

// ─── Cells / task count display ───────────────────────────────────────────────
document.getElementById('cellsInput').addEventListener('input', function () {
    document.getElementById('cellsVal').textContent       = this.value;
    document.getElementById('taskCellsCount').textContent = this.value - 2;
    refresh();
});

// ─── Title change ─────────────────────────────────────────────────────────────
document.getElementById('titleInput').addEventListener('input', refresh);

// ─── Tasks textarea ───────────────────────────────────────────────────────────
document.getElementById('tasks-area').addEventListener('input', refresh);

// ─── Insert special token into textarea ───────────────────────────────────────
function insertSpecial(token) {
    const ta  = document.getElementById('tasks-area');
    const pos = ta.selectionStart;
    const val = ta.value;
    // Insert on a new line
    const before = val.slice(0, pos);
    const after  = val.slice(pos);
    const nl     = (before.length && !before.endsWith('\n')) ? '\n' : '';
    ta.value = before + nl + token + '\n' + after;
    ta.selectionStart = ta.selectionEnd = pos + nl.length + token.length + 1;
    ta.focus();
    refresh();
}

// ─── Copy URL ─────────────────────────────────────────────────────────────────
document.getElementById('copyBtn').addEventListener('click', () => {
    const url = document.getElementById('urlDisplay').value;
    navigator.clipboard.writeText(url).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = '✅ Скопировано';
        setTimeout(() => btn.textContent = 'Копировать', 1800);
    });
});

// ─── Init ─────────────────────────────────────────────────────────────────────
refresh();
</script>
</body>
</html>
