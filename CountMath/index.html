<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Считай и решай</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #e0f7fa;
            overflow-x: hidden;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* ── Задача: [предметы] ± [предметы] = ? ───────────────── */
        #problem-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: nowrap;
            min-height: 180px;
            margin: 10px 0 4px;
        }

        .box {
            flex: 0 1 auto;
            min-width: 120px;
            min-height: 120px;
            max-width: 40vw;
            padding: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            align-content: center;
            justify-content: center;
            background: #fff;
            border: 4px solid #0097a7;
            border-radius: 20px;
            box-shadow: 0 6px 0 #80deea;
        }
        .box span {
            font-size: 2.8rem;
            line-height: 1;
        }

        .op-sign {
            font-size: 3.4rem;
            font-weight: 900;
            color: #e65100;
            flex: 0 0 auto;
        }
        .eq-sign {
            font-size: 3rem;
            font-weight: 900;
            color: #00838f;
            flex: 0 0 auto;
        }

        /* Слот ответа */
        #answer-slot {
            width: 96px;
            height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.4rem;
            font-weight: 800;
            color: #90a4ae;
            background: #f1fbfc;
            border: 4px dashed #26c6da;
            border-radius: 18px;
            flex: 0 0 auto;
            transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.15s;
        }
        #answer-slot.correct {
            background: #c8e6c9; border-color: #388e3c; border-style: solid; color: #1b5e20;
            transform: scale(1.08);
        }
        #answer-slot.wrong {
            background: #ffcdd2; border-color: #c62828; color: #b71c1c;
            animation: shake 0.35s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        /* ── Кнопки-ответы ─────────────────────────────────────── */
        #choices {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            padding: 16px 12px;
        }
        .choice-btn {
            width: 80px;
            height: 80px;
            font-size: 2.4rem;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(145deg, #26c6da, #0097a7);
            border: none;
            border-radius: 16px;
            box-shadow: 0 5px 0 #00838f, 0 7px 10px rgba(0,0,0,.2);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s, opacity 0.2s;
            user-select: none;
        }
        .choice-btn:hover:not(:disabled) { background: linear-gradient(145deg, #4dd0e1, #26c6da); }
        .choice-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 #00838f; }
        .choice-btn:disabled { opacity: 0.4; cursor: default; }
        .choice-btn.wrong-choice {
            background: linear-gradient(145deg, #ef5350, #e53935);
            opacity: 0.5; pointer-events: none;
        }

        #progress-bar-wrap {
            height: 10px;
            background: #b2ebf2;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 6px;
        }
        #progress-bar {
            height: 100%;
            background: #0097a7;
            border-radius: 5px;
            transition: width 0.4s ease;
        }

        @media (max-width: 640px) {
            .box span { font-size: 2rem; }
            .box { min-width: 90px; min-height: 90px; }
            .op-sign { font-size: 2.6rem; }
            #answer-slot { width: 66px; height: 66px; font-size: 2.4rem; }
            .choice-btn { width: 64px; height: 64px; font-size: 1.9rem; }
        }
    </style>
</head>
<body>

<div class="container py-3">
    <h1 class="text-center mb-2">🧮 Считай и решай</h1>

    <div class="d-flex justify-content-between align-items-center mb-1">
        <span id="progress-text" class="text-muted small"></span>
        <div class="d-flex gap-2">
            <span id="score" class="badge bg-success align-self-center fs-6">⭐ 0</span>
            <span id="errors" class="badge bg-danger align-self-center fs-6">❌ 0</span>
            <button id="fullscreen-btn" class="btn btn-sm btn-primary">Full Screen</button>
        </div>
    </div>
    <div id="progress-bar-wrap"><div id="progress-bar" style="width:0%"></div></div>

    <!-- Задача -->
    <div id="problem-area">
        <div id="box-left" class="box"></div>
        <div id="op" class="op-sign">+</div>
        <div id="box-right" class="box"></div>
        <div class="eq-sign">=</div>
        <div id="answer-slot">?</div>
    </div>

    <p class="text-center text-muted small mb-1">Посчитай предметы и выбери ответ! 👇</p>

    <div id="choices"></div>
</div>

<!-- Start overlay -->
<div id="start-overlay" style="position:fixed;inset:0;background:rgba(224,247,250,0.97);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;">
    <div style="font-size:5rem;margin-bottom:16px;">🧮</div>
    <h2 style="margin-bottom:24px;color:#00838f;">Считай и решай</h2>
    <button id="start-btn" style="font-size:1.6rem;padding:16px 48px;border:none;border-radius:16px;background:linear-gradient(145deg,#0097a7,#26c6da);color:#fff;box-shadow:0 6px 0 #00838f,0 8px 16px rgba(0,0,0,.2);cursor:pointer;">▶ Начать игру</button>
</div>

<!-- Win overlay -->
<div id="win-overlay" style="position:fixed;inset:0;background:rgba(224,247,250,0.97);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:999;">
    <div style="font-size:5rem;margin-bottom:16px;">🎉🧮🎉</div>
    <h2 style="margin-bottom:8px;color:#00838f;">Молодец!</h2>
    <p id="win-score" style="font-size:1.4rem;color:#2e7d32;margin-bottom:24px;"></p>
    <button id="again-btn" style="font-size:1.4rem;padding:14px 40px;border:none;border-radius:16px;background:linear-gradient(145deg,#43a047,#66bb6a);color:#fff;box-shadow:0 6px 0 #2e7d32,0 8px 16px rgba(0,0,0,.2);cursor:pointer;">↻ Ещё раз</button>
</div>

<script>
    // ── Настройки из URL ────────────────────────────────────────
    const params = new URLSearchParams(window.location.search);

    // ops: "+", "-" или "+,-"
    const OPS = (params.get('ops') || '+').split(',').map(s => s.trim()).filter(s => ['+','-'].includes(s));
    const OPERATIONS = OPS.length ? OPS : ['+'];

    // Максимум предметов в одной коробке
    const MAX = parseInt(params.get('max') ?? '5', 10);
    const COUNT = parseInt(params.get('count') ?? '10', 10);      // сколько заданий
    const CHOICE_COUNT = parseInt(params.get('choices') ?? '4', 10); // вариантов ответа
    const EMOJIS = (params.get('emojis') || '🍎,🍌,⭐,🐱,🐟,🎈,🚗,🌼')
        .split(',').map(s => s.trim()).filter(Boolean);

    const bgColor = params.get('bgcolor') ? `#${params.get('bgcolor')}` : '#e0f7fa';
    document.body.style.setProperty('background-color', bgColor, 'important');

    // ── Состояние ───────────────────────────────────────────────
    let roundIdx = 0;
    let score = 0;
    let errorCount = 0;
    let currentAnswer = null;

    const boxLeft  = document.getElementById('box-left');
    const boxRight = document.getElementById('box-right');
    const opEl     = document.getElementById('op');
    const answerSlot = document.getElementById('answer-slot');
    const choicesEl = document.getElementById('choices');
    const progressBar  = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const scoreEl  = document.getElementById('score');
    const errorsEl = document.getElementById('errors');

    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function fillBox(el, n, emoji) {
        el.innerHTML = '';
        for (let i = 0; i < n; i++) {
            const s = document.createElement('span');
            s.textContent = emoji;
            el.appendChild(s);
        }
    }

    function makeChoices(answer) {
        const maxResult = OPERATIONS.includes('+') ? MAX * 2 : MAX;
        const set = new Set([answer]);
        const target = Math.min(CHOICE_COUNT, maxResult + 1);
        let guard = 0;
        while (set.size < target && guard < 200) {
            guard++;
            const delta = randInt(1, 3);
            const cand = Math.random() < 0.5 ? answer - delta : answer + delta;
            if (cand < 0 || cand > maxResult) continue;
            set.add(cand);
        }
        for (let v = 0; v <= maxResult && set.size < target; v++) set.add(v);
        const arr = [...set];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function renderRound() {
        const op = OPERATIONS[randInt(0, OPERATIONS.length - 1)];
        let a, b;
        if (op === '+') {
            a = randInt(1, MAX);
            b = randInt(1, MAX);
            currentAnswer = a + b;
        } else {
            // вычитание без отрицательного результата: a >= b
            a = randInt(1, MAX);
            b = randInt(0, a);
            currentAnswer = a - b;
        }

        const emoji = EMOJIS[randInt(0, EMOJIS.length - 1)] || '🍎';
        fillBox(boxLeft, a, emoji);
        fillBox(boxRight, b, emoji);
        opEl.textContent = op === '-' ? '−' : '+';

        answerSlot.textContent = '?';
        answerSlot.className = '';

        choicesEl.innerHTML = '';
        makeChoices(currentAnswer).forEach(val => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.textContent = val;
            btn.addEventListener('click', () => onChoice(val, btn));
            choicesEl.appendChild(btn);
        });

        progressText.textContent = `Задание ${roundIdx + 1} из ${COUNT}`;
        progressBar.style.width = `${(roundIdx / COUNT) * 100}%`;
    }

    function onChoice(val, btn) {
        if (val === currentAnswer) {
            playCorrect();
            answerSlot.textContent = val;
            answerSlot.classList.add('correct');
            score++;
            scoreEl.textContent = `⭐ ${score}`;
            [...choicesEl.children].forEach(b => b.disabled = true);
            setTimeout(() => {
                roundIdx++;
                if (roundIdx < COUNT) renderRound();
                else onGameComplete();
            }, 750);
        } else {
            playWrong();
            errorCount++;
            errorsEl.textContent = `❌ ${errorCount}`;
            btn.classList.add('wrong-choice');
            answerSlot.classList.add('wrong');
            setTimeout(() => answerSlot.classList.remove('wrong'), 400);
        }
    }

    function onGameComplete() {
        playFanfare();
        progressBar.style.width = '100%';
        progressText.textContent = '🎉 Все задания выполнены!';
        document.getElementById('win-score').textContent =
            `Правильных ответов: ${score} из ${COUNT} ⭐  Ошибок: ${errorCount} ❌`;
        document.getElementById('win-overlay').style.display = 'flex';
    }

    function startGame() {
        roundIdx = 0;
        score = 0;
        errorCount = 0;
        scoreEl.textContent = '⭐ 0';
        errorsEl.textContent = '❌ 0';
        renderRound();
    }

    // Fullscreen
    const fsBtn = document.getElementById('fullscreen-btn');
    fsBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    });
    document.addEventListener('fullscreenchange', () => {
        fsBtn.textContent = document.fullscreenElement ? 'Exit Full Screen' : 'Full Screen';
    });

    document.getElementById('start-btn').addEventListener('click', () => {
        if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
        if (actx.state !== 'running') actx.resume();
        document.getElementById('start-overlay').style.display = 'none';
        startGame();
    });
    document.getElementById('again-btn').addEventListener('click', () => {
        document.getElementById('win-overlay').style.display = 'none';
        startGame();
    });

    renderRound();

    // ── Звук ────────────────────────────────────────────────────
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function readyCtx() { if (!actx) actx = new AudioCtx(); if (actx.state !== 'running') actx.resume(); return actx; }

    function playCorrect() {
        const ctx = readyCtx(); const t = ctx.currentTime + 0.01;
        const osc = ctx.createOscillator(), g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, t);
        osc.frequency.exponentialRampToValueAtTime(880, t + 0.12);
        g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        osc.start(t); osc.stop(t + 0.19);
    }
    function playWrong() {
        const ctx = readyCtx(); const t = ctx.currentTime + 0.01;
        const osc = ctx.createOscillator(), g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, t);
        osc.frequency.exponentialRampToValueAtTime(100, t + 0.25);
        g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        osc.start(t); osc.stop(t + 0.26);
    }
    function playFanfare() {
        const ctx = readyCtx(); const t0 = ctx.currentTime + 0.01;
        [523, 659, 784, 1047].forEach((f, i) => {
            const t = t0 + i * 0.18;
            const osc = ctx.createOscillator(), g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.type = 'triangle'; osc.frequency.value = f;
            g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.3, t + 0.04);
            g.gain.setValueAtTime(0.3, t + 0.12); g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
            osc.start(t); osc.stop(t + 0.36);
        });
    }
</script>
</body>
</html>
