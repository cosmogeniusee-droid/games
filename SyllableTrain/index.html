<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Слоговой поезд</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #e8f5e9;
            overflow-x: hidden;
        }

        /* ── Track ─────────────────────────────────────────────── */
        #track-area {
            position: relative;
            min-height: 160px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 12px;
            overflow: hidden;
        }

        /* Rail lines */
        #track-area::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0; right: 0;
            height: 14px;
            background: repeating-linear-gradient(
                to right,
                #8d6e63 0px, #8d6e63 40px,
                transparent 40px, transparent 60px
            );
            border-top: 4px solid #5d4037;
            border-bottom: 4px solid #5d4037;
            pointer-events: none;
        }

        /* ── Train wrapper (animated on success) ───────────────── */
        #train {
            display: inline-flex;
            align-items: flex-end;
            gap: 0;
            position: relative;
            z-index: 1;
            transition: none;
        }

        #train.choo {
            animation: choo-choo 1.2s cubic-bezier(0.4,0,0.2,1) forwards;
        }

        @keyframes choo-choo {
            0%   { transform: translateX(0); }
            10%  { transform: translateX(10px); }
            100% { transform: translateX(-120vw); }
        }

        /* ── Locomotive ─────────────────────────────────────────── */
        #locomotive {
            font-size: 4rem;
            line-height: 1;
            margin-right: -4px;
            filter: drop-shadow(2px 2px 3px rgba(0,0,0,.25));
            user-select: none;
        }

        /* ── Train slots (empty/filled wagons on the track) ─────── */
        .train-slot {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 80px;
            min-height: 80px;
            background: #fff8e1;
            border: 3px dashed #ffb300;
            border-radius: 10px 10px 4px 4px;
            margin: 0 3px;
            font-size: 1.6rem;
            font-weight: bold;
            color: #555;
            position: relative;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
        }

        /* Wagon wheels */
        .train-slot::after {
            content: '⚙ ⚙';
            font-size: 0.7rem;
            position: absolute;
            bottom: -18px;
            color: #78909c;
            letter-spacing: 10px;
        }

        .train-slot.filled {
            background: #fff9c4;
            border: 3px solid #fbc02d;
            color: #333;
        }

        .train-slot.correct {
            background: #c8e6c9;
            border-color: #388e3c;
            color: #1b5e20;
        }

        .train-slot.wrong {
            animation: shake 0.35s ease;
            background: #ffcdd2;
            border-color: #c62828;
            color: #b71c1c;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-8px); }
            40%       { transform: translateX(8px); }
            60%       { transform: translateX(-6px); }
            80%       { transform: translateX(6px); }
        }

        /* ── Station: syllable wagons to pick from ──────────────── */
        #station {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            padding: 24px 12px 12px;
        }

        .syllable-btn {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90px;
            min-height: 90px;
            background: linear-gradient(145deg, #ff8f00, #ffa000);
            color: #fff;
            font-size: 1.8rem;
            font-weight: bold;
            border: none;
            border-radius: 12px 12px 6px 6px;
            box-shadow: 0 4px 0 #e65100, 0 6px 8px rgba(0,0,0,.2);
            cursor: pointer;
            position: relative;
            transition: transform 0.1s, box-shadow 0.1s, opacity 0.2s;
            user-select: none;
        }

        /* Wagon wheels on station buttons */
        .syllable-btn::after {
            content: '⚙ ⚙';
            font-size: 0.65rem;
            position: absolute;
            bottom: -16px;
            color: #78909c;
            letter-spacing: 8px;
        }

        .syllable-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #e65100, 0 2px 4px rgba(0,0,0,.15);
        }

        .syllable-btn:hover:not(:disabled) {
            background: linear-gradient(145deg, #ffb300, #ffc107);
        }

        .syllable-btn:disabled,
        .syllable-btn.used {
            opacity: 0.3;
            cursor: default;
            pointer-events: none;
        }

        /* ── Progress & UI ──────────────────────────────────────── */
        #progress-bar-wrap {
            height: 10px;
            background: #c8e6c9;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 6px;
        }
        #progress-bar {
            height: 100%;
            background: #43a047;
            border-radius: 5px;
            transition: width 0.4s ease;
        }

        #word-display {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 4px;
            min-height: 2.5rem;
            color: #2e7d32;
        }

        #smoke {
            position: absolute;
            top: 10px;
            font-size: 1.5rem;
            animation: smoke-rise 1.2s ease-out forwards;
            opacity: 0;
            pointer-events: none;
        }
        @keyframes smoke-rise {
            0%   { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.8); }
        }
    </style>
</head>
<body>

<div class="container py-3">
    <h1 class="text-center mb-2">🚂 Слоговой поезд 🚂</h1>

    <div class="d-flex justify-content-between align-items-center mb-1">
        <span id="progress-text" class="text-muted small"></span>
        <div class="d-flex gap-2">
            <button id="hint-btn" class="btn btn-sm btn-outline-warning">💡 Подсказка</button>
            <button id="fullscreen-btn" class="btn btn-sm btn-primary">Full Screen</button>
        </div>
    </div>
    <div id="progress-bar-wrap"><div id="progress-bar" style="width:0%"></div></div>

    <!-- Assembled word display -->
    <div id="word-display" class="text-center mb-1"></div>

    <!-- Track with train -->
    <div id="track-area">
        <div id="train">
            <div id="locomotive">🚂</div>
            <!-- train slots injected here -->
        </div>
        <!-- smoke injected on success -->
    </div>

    <p class="text-center text-muted small mb-1">Нажимай на вагончики снизу в правильном порядке!</p>

    <!-- Station: syllable buttons -->
    <div id="station"></div>
</div>

<!-- Start overlay -->
<div id="start-overlay" style="position:fixed;inset:0;background:rgba(232,245,233,0.97);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;">
    <div style="font-size:5rem;margin-bottom:16px;">🚂</div>
    <h2 style="margin-bottom:24px;color:#2e7d32;">Слоговой поезд</h2>
    <button id="start-btn" style="font-size:1.6rem;padding:16px 48px;border:none;border-radius:16px;background:linear-gradient(145deg,#43a047,#66bb6a);color:#fff;box-shadow:0 6px 0 #2e7d32,0 8px 16px rgba(0,0,0,.2);cursor:pointer;">▶ Начать игру</button>
</div>

<script>
    const defaultWords = [
        ['МА','МА'],
        ['МО','ЛО','КО'],
        ['КО','ШКА'],
        ['СО','БА','КА'],
        ['РЫ','БА']
    ];

    const params = new URLSearchParams(window.location.search);

    // words param: "МА-МА,МО-ЛО-КО,КО-ШКА" → syllables split by '-', words by ','
    let wordList;
    if (params.get('words')) {
        wordList = params.get('words').split(',').map(w => w.split('-').map(s => s.toUpperCase()));
    } else {
        wordList = defaultWords;
    }

    const bgColor = params.get('bgcolor') ? `#${params.get('bgcolor')}` : '#e8f5e9';
    const bgImage = params.get('bg')      ? `url(${params.get('bg')})` : '';
    document.body.style.setProperty('background-color', bgColor, 'important');
    if (bgImage) {
        document.body.style.setProperty('background-image', bgImage, 'important');
        document.body.style.setProperty('background-size', 'cover', 'important');
        document.body.style.setProperty('background-position', 'center', 'important');
    }

    // Shuffle word list
    for (let i = wordList.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [wordList[i], wordList[j]] = [wordList[j], wordList[i]];
    }

    let currentWordIdx = 0;
    let currentSyllables = [];   // correct order
    let shuffled = [];           // shuffled syllables (with original index)
    let selected = [];           // indices into shuffled[] chosen so far
    let slotEls = [];
    let btnEls  = [];

    const train       = document.getElementById('train');
    const locomotive  = document.getElementById('locomotive');
    const station     = document.getElementById('station');
    const wordDisplay = document.getElementById('word-display');
    const progressBar = document.getElementById('progress-bar');
    const progressText= document.getElementById('progress-text');

    function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function loadWord(idx) {
        currentSyllables = wordList[idx];
        shuffled = shuffle(currentSyllables.map((s, i) => ({ syl: s, origIdx: i })));
        selected = [];
        slotEls  = [];
        btnEls   = [];

        // Progress
        progressText.textContent = `Слово ${idx + 1} из ${wordList.length}`;
        progressBar.style.width  = `${(idx / wordList.length) * 100}%`;
        wordDisplay.textContent  = '';

        // Build train slots
        // Remove old slots (keep locomotive)
        while (train.children.length > 1) train.removeChild(train.lastChild);

        currentSyllables.forEach((_, i) => {
            const slot = document.createElement('div');
            slot.className = 'train-slot';
            slot.dataset.idx = i;
            train.appendChild(slot);
            slotEls.push(slot);
        });

        // Build station buttons
        station.innerHTML = '';
        shuffled.forEach((item, btnIdx) => {
            const btn = document.createElement('button');
            btn.className = 'syllable-btn';
            btn.textContent = item.syl;
            btn.dataset.btnIdx = btnIdx;
            btn.addEventListener('click', () => onSyllableClick(btnIdx));
            station.appendChild(btn);
            btnEls.push(btn);
        });

        // Remove choo class
        train.classList.remove('choo');
    }

    function onSyllableClick(btnIdx) {
        if (btnEls[btnIdx].classList.contains('used')) return;

        const chosenItem = shuffled[btnIdx];
        const pos = selected.length; // which slot are we filling?

        // Check if correct
        if (chosenItem.syl === currentSyllables[pos]) {
            // Correct!
            playClunk();
            selected.push(btnIdx);
            btnEls[btnIdx].classList.add('used');

            const slot = slotEls[pos];
            slot.textContent = chosenItem.syl;
            slot.classList.add('filled');

            // Animate slot correct
            setTimeout(() => slot.classList.add('correct'), 50);

            // Update word display
            wordDisplay.textContent = selected.map(bi => shuffled[bi].syl).join('·');

            if (selected.length === currentSyllables.length) {
                // Word complete!
                setTimeout(onWordComplete, 400);
            }
        } else {
            // Wrong — flash the button and the next slot red
            playWrong();
            btnEls[btnIdx].style.background = 'linear-gradient(145deg,#ef5350,#e53935)';
            slotEls[pos].classList.add('wrong');
            setTimeout(() => {
                btnEls[btnIdx].style.background = '';
                slotEls[pos].classList.remove('wrong');
            }, 400);
        }
    }

    function onWordComplete() {
        // Show full word
        wordDisplay.textContent = currentSyllables.join('');

        // Whistle + chugging
        playWhistle();
        playChugging(1200);

        // Smoke puff
        const smoke = document.createElement('span');
        smoke.id = 'smoke';
        smoke.textContent = '💨';
        locomotive.after(smoke);
        setTimeout(() => smoke.remove(), 1200);

        // Choo-choo!
        train.classList.add('choo');

        setTimeout(() => {
            currentWordIdx++;
            if (currentWordIdx < wordList.length) {
                loadWord(currentWordIdx);
            } else {
                onGameComplete();
            }
        }, 1400);
    }

    function onGameComplete() {
        playFanfare();
        train.classList.remove('choo');
        progressBar.style.width = '100%';
        progressText.textContent = '🎉 Все слова собраны!';
        wordDisplay.textContent  = '🎉';
        station.innerHTML = `<div class="text-center w-100 py-3 fw-bold fs-4 text-success">Молодец! Все слова собраны! 🚂💨</div>`;
        while (train.children.length > 1) train.removeChild(train.lastChild);
    }

    document.getElementById('hint-btn').addEventListener('click', () => {
        // Find the first un-used correct button
        const pos = selected.length;
        if (pos >= currentSyllables.length) return;
        const correctBtnIdx = shuffled.findIndex((item, i) =>
            item.syl === currentSyllables[pos] && !btnEls[i].classList.contains('used')
        );
        if (correctBtnIdx !== -1) {
            btnEls[correctBtnIdx].style.outline = '4px solid #66bb6a';
            setTimeout(() => { btnEls[correctBtnIdx].style.outline = ''; }, 1000);
        }
    });

    const fsBtn = document.getElementById('fullscreen-btn');
    fsBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    });
    document.addEventListener('fullscreenchange', () => {
        fsBtn.textContent = document.fullscreenElement ? 'Exit Full Screen' : 'Full Screen';
    });

    loadWord(0);

    // ── Sound engine (Web Audio API) ────────────────────────────────────────
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;

    function getAudioCtx() {
        if (!actx) actx = new AudioCtx();
        return actx;
    }

    // Returns a running AudioContext — instant if already running.
    async function readyCtx() {
        const ctx = getAudioCtx();
        if (ctx.state !== 'running') await ctx.resume();
        return ctx;
    }

    // Start button — AudioContext created and unlocked inside the click gesture.
    // After this, the hardware is warm for all subsequent sounds.
    document.getElementById('start-btn').addEventListener('click', () => {
        if (!actx) actx = new AudioCtx();
        const ctx = actx;
        // Silent buffer — unlocks audio hardware on iOS Safari
        const buf = ctx.createBuffer(1, 1, ctx.sampleRate);
        const src = ctx.createBufferSource();
        src.buffer = buf;
        src.connect(ctx.destination);
        src.start(0);
        if (ctx.state !== 'running') ctx.resume();
        document.getElementById('start-overlay').style.display = 'none';
    });

    // Short "clunk" when a syllable clicks into the wagon
    async function playClunk() {
        const ctx = await readyCtx();
        const t = ctx.currentTime + 0.01;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(180, t);
        osc.frequency.exponentialRampToValueAtTime(70, t + 0.12);
        gain.gain.setValueAtTime(0.35, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        osc.start(t); osc.stop(t + 0.16);
    }

    // Buzzer for wrong pick
    async function playWrong() {
        const ctx = await readyCtx();
        const t = ctx.currentTime + 0.01;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, t);
        osc.frequency.exponentialRampToValueAtTime(100, t + 0.25);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        osc.start(t); osc.stop(t + 0.26);
    }

    // Train whistle — two classic "woo-woo" blasts with harmonic richness
    async function playWhistle() {
        const ctx = await readyCtx();
        const t0 = ctx.currentTime + 0.01;

        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -6;
        comp.ratio.value = 4;
        comp.connect(ctx.destination);

        function blast(startT, dur, rootHz) {
            const freqs   = [rootHz, rootHz * 2, rootHz * 3];
            const volumes = [0.35,   0.15,        0.08];
            freqs.forEach((f, i) => {
                const osc  = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(comp);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(f * 1.02, startT);
                osc.frequency.linearRampToValueAtTime(f,        startT + 0.05);
                osc.frequency.setValueAtTime(f,                 startT + dur - 0.1);
                osc.frequency.linearRampToValueAtTime(f * 0.96, startT + dur);
                gain.gain.setValueAtTime(0, startT);
                gain.gain.linearRampToValueAtTime(volumes[i],  startT + 0.04);
                gain.gain.setValueAtTime(volumes[i],           startT + dur - 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001,  startT + dur);
                osc.start(startT); osc.stop(startT + dur + 0.01);
            });
        }

        blast(t0,        0.30, 622);
        blast(t0 + 0.42, 0.52, 622);
    }

    // Rhythmic chug-chug while train departs
    async function playChugging(durationMs) {
        const ctx = await readyCtx();
        const t0 = ctx.currentTime + 0.01;
        const interval = 0.25;
        const steps = Math.floor(durationMs / (interval * 1000));

        const bufLen = Math.ceil(ctx.sampleRate * 0.3);
        const noiseBuffer = ctx.createBuffer(1, bufLen, ctx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let k = 0; k < bufLen; k++) data[k] = Math.random() * 2 - 1;

        for (let i = 0; i < steps; i++) {
            const t = t0 + i * interval;

            const thumpSrc = ctx.createBufferSource();
            thumpSrc.buffer = noiseBuffer;
            const thumpLp = ctx.createBiquadFilter();
            thumpLp.type = 'lowpass'; thumpLp.frequency.value = 120; thumpLp.Q.value = 2;
            const thumpGain = ctx.createGain();
            thumpSrc.connect(thumpLp); thumpLp.connect(thumpGain); thumpGain.connect(ctx.destination);
            thumpGain.gain.setValueAtTime(1.2, t);
            thumpGain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
            thumpSrc.start(t); thumpSrc.stop(t + 0.13);

            const hissSrc = ctx.createBufferSource();
            hissSrc.buffer = noiseBuffer;
            const hissBp = ctx.createBiquadFilter();
            hissBp.type = 'bandpass'; hissBp.frequency.value = 800; hissBp.Q.value = 0.6;
            const hissGain = ctx.createGain();
            hissSrc.connect(hissBp); hissBp.connect(hissGain); hissGain.connect(ctx.destination);
            hissGain.gain.setValueAtTime(0, t + 0.05);
            hissGain.gain.linearRampToValueAtTime(0.35, t + 0.09);
            hissGain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
            hissSrc.start(t + 0.05); hissSrc.stop(t + 0.23);
        }
    }

    // Fanfare on game complete
    async function playFanfare() {
        const ctx = await readyCtx();
        const t0 = ctx.currentTime + 0.01;
        const notes = [523, 659, 784, 1047];
        notes.forEach((freq, i) => {
            const t = t0 + i * 0.18;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type = 'triangle';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(0.3, t + 0.04);
            gain.gain.setValueAtTime(0.3, t + 0.12);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
            osc.start(t); osc.stop(t + 0.36);
        });
    }
</script>
</body>
</html>
