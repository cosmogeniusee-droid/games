<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конфигуратор игры "Слоговой поезд"</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .word-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .word-row input {
            flex: 1;
            min-width: 140px;
        }

        .syl-preview {
            display: inline-flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .syl-chip {
            background: #ffa000;
            color: #fff;
            border-radius: 8px;
            padding: 2px 10px;
            font-weight: bold;
            font-size: 1rem;
        }

        #words-list {
            max-height: 340px;
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-light">
<div class="container mt-4">
    <h1 class="mb-2">📝 Конфигуратор игры "Слоговой поезд"</h1>
    <p class="text-muted mb-4">Введите слова, разбитые на слоги через дефис. Каждое слово — отдельная строка. Ребёнок будет собирать поезд из слогов.</p>

    <div class="row g-4">
        <!-- Left -->
        <div class="col-lg-5">
            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="card-title">Слова со слогами</h5>
                    <p class="text-muted small mb-2">Формат: <code>МА-МА</code>, <code>МО-ЛО-КО</code> (слоги через дефис)</p>

                    <div id="words-list"></div>
                    <button id="add-word-btn" class="btn btn-outline-primary btn-sm w-100 mt-2">+ Добавить слово</button>
                </div>
            </div>

            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="card-title">Оформление</h5>
                    <div class="mb-3">
                        <label for="bgColorInput" class="form-label">Цвет фона:</label>
                        <input type="color" id="bgColorInput" class="form-control form-control-color" value="#e8f5e9">
                    </div>
                    <div class="mb-3">
                        <label for="bgInput" class="form-label">URL фонового изображения (необязательно):</label>
                        <input type="url" id="bgInput" class="form-control" placeholder="https://example.com/background.jpg">
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Ссылка</h5>
                    <div class="mb-3">
                        <div class="input-group">
                            <input type="text" id="urlDisplay" class="form-control" readonly>
                            <button class="btn btn-outline-secondary" type="button" id="copyLink">Копировать</button>
                        </div>
                    </div>
                    <a id="gameLink" href="#" target="_blank" class="btn btn-success w-100">🚀 Открыть игру в новой вкладке</a>
                </div>
            </div>
        </div>

        <!-- Right: preview -->
        <div class="col-lg-7">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Превью</h5>
                    <div class="ratio ratio-1x1 border rounded">
                        <iframe id="previewFrame" src="" title="Превью игры"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const defaultWords = ['МА-МА', 'МО-ЛО-КО', 'КО-ШКА', 'СО-БА-КА', 'РЫ-БА'];

    const wordsList   = document.getElementById('words-list');
    const addWordBtn  = document.getElementById('add-word-btn');
    const bgColorInput= document.getElementById('bgColorInput');
    const bgInput     = document.getElementById('bgInput');
    const urlDisplay  = document.getElementById('urlDisplay');
    const gameLink    = document.getElementById('gameLink');
    const copyLink    = document.getElementById('copyLink');
    const previewFrame= document.getElementById('previewFrame');

    function parseWord(raw) {
        return raw.trim().toUpperCase().replace(/\s+/g, '');
    }

    function syllableChips(raw) {
        const parts = parseWord(raw).split('-').filter(Boolean);
        return parts.map(p => `<span class="syl-chip">${p}</span>`).join('');
    }

    function addWordRow(value = '') {
        const row = document.createElement('div');
        row.className = 'word-row';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'form-control form-control-sm';
        input.placeholder = 'КО-ШКА';
        input.value = value;

        const preview = document.createElement('span');
        preview.className = 'syl-preview';
        preview.innerHTML = value ? syllableChips(value) : '';

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'btn btn-outline-danger btn-sm';
        delBtn.textContent = '✕';
        delBtn.addEventListener('click', () => {
            row.remove();
            updateLink();
        });

        input.addEventListener('input', () => {
            preview.innerHTML = syllableChips(input.value);
            updateLink();
        });

        row.appendChild(input);
        row.appendChild(preview);
        row.appendChild(delBtn);
        wordsList.appendChild(row);
    }

    function getWords() {
        return [...wordsList.querySelectorAll('input')]
            .map(i => parseWord(i.value))
            .filter(w => w.includes('-') && w.replace(/-/g, '').length > 0);
    }

    function updateLink() {
        const words = getWords();
        const baseUrl = 'index.html';
        const urlParams = new URLSearchParams();

        if (words.length > 0) urlParams.set('words', words.join(','));
        if (bgColorInput.value !== '#e8f5e9') urlParams.set('bgcolor', bgColorInput.value.substring(1));
        if (bgInput.value) urlParams.set('bg', bgInput.value);

        const qs = urlParams.toString();
        const previewUrl = qs ? `${baseUrl}?${qs}` : baseUrl;
        const fullUrl = `https://cosmogeniusee-droid.github.io/games/SyllableTrain/${previewUrl}`;

        urlDisplay.value = fullUrl;
        gameLink.href = previewUrl;
        previewFrame.src = previewUrl;
    }

    addWordBtn.addEventListener('click', () => { addWordRow(); updateLink(); });
    bgColorInput.addEventListener('input', updateLink);
    bgInput.addEventListener('input', updateLink);

    copyLink.addEventListener('click', () => {
        navigator.clipboard.writeText(urlDisplay.value).then(() => {
            const orig = copyLink.textContent;
            copyLink.textContent = 'Скопировано!';
            setTimeout(() => { copyLink.textContent = orig; }, 2000);
        });
    });

    // Init default words
    defaultWords.forEach(w => addWordRow(w));
    updateLink();
</script>
</body>
</html>
